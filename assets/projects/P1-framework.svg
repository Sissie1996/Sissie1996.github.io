<svg xmlns="http://www.w3.org/2000/svg" width="1368" height="820" viewBox="0 0 1368 820" role="img" aria-labelledby="title desc">
<title id="title">Multimodal interaction framework</title><desc id="desc">An English redraw of the supplied project figure. The observation–orientation–decision–action sequence runs from state perception through situation awareness, assessment, and operational planning to action commands. Support includes interaction services and information recommendations. Inputs, outputs, physical context, individual action, and group coordination are retained.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#426747" stroke-width="1.4"/></marker></defs>
